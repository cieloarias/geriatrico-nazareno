<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residencias | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Conoce nuestras dos residencias en San Borja, Lima: Sede San Borja (Av. Las Artes Norte 1249) y Sede Salvador Dalí (Salvador Dalí 490). Mismo equipo, mismos estándares de cuidado.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="residencias">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <!-- ================= OPENER — type + photo together ================= -->
  <section class="page-opener">
    <div class="container">
      <div class="page-opener-grid">
        <div class="page-opener-intro" data-reveal>
          <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.residencias"></span></div>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="sedes.eyebrow"></span></div>
          <h1 data-i18n="sedes.title"></h1>
          <p class="lede" data-i18n="sedes.lede"></p>
          <div class="page-opener-stat">
            <strong id="sedesCount"></strong>
            <span data-i18n="sedes.stat"></span>
          </div>
        </div>
        <div class="page-opener-media" data-reveal>
          <figure class="page-opener-figure-main">
            <img src="assets/images/sedes/sede-san-borja.jpg" alt="Fachada de la sede San Borja" loading="eager">
          </figure>
          <figure class="page-opener-figure-peek">
            <img src="assets/videos/residencia-dali-poster.jpg" alt="Sede Salvador Dalí" loading="eager">
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= FULL ARCHITECTURAL CHAPTERS — one per sede, inverted order ================= -->
  <section class="section">
    <div class="container">
      <div id="residenceChapters"></div>
      <blockquote class="residencias-quote" id="residenciasQuote" style="margin-top:clamp(3rem,6vw,4.5rem);max-width:46ch;border-top-color:var(--color-line)"></blockquote>
    </div>
  </section>

  <!-- ================= SERVICES CROSS-SELL — brief, no widget duplication ================= -->
  <section class="section-tight section-alt">
    <div class="container" data-reveal>
      <div class="split-editorial" style="align-items:center">
        <div class="split-editorial-intro">
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="services.eyebrow"></span></div>
          <h2 style="margin-top:.6rem" data-i18n-html="home.servicesTitleHtml"></h2>
          <p class="lede" data-i18n="services.lede"></p>
          <a class="link-arrow" style="margin-top:1.2rem" href="servicios.html"><span data-i18n="cta.verServicios"></span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <figure class="split-editorial-media">
          <img src="assets/images/gallery/11.jpg" alt="Habitación adaptada para el adulto mayor" loading="lazy">
        </figure>
      </div>
    </div>
  </section>

  <!-- ================= VISIT US ================= -->
  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band cta-band-photo">
        <img src="assets/images/gallery/15.jpg" alt="" aria-hidden="true">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
          <a class="btn btn-ghost-light" href="contacto.html" data-i18n="nav.contacto"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  document.getElementById("sedesCount").textContent = SITE_DATA.sedes.length;
  registerRender(() => renderResidenceChapters("residenceChapters"));
  registerRender(function(){
    const el = document.getElementById("residenciasQuote");
    const lang = getLang();
    const t = SITE_DATA.testimonials.find(x => x.name === "Humberto Valdivia Yoplac") || SITE_DATA.testimonials[0];
    el.innerHTML = `<p style="color:var(--color-ink)">&ldquo;${t[lang] || t.es}&rdquo;</p><span style="color:var(--color-ink-soft)">— ${t.name}</span>`;
  });
</script>
</body>
</html>
