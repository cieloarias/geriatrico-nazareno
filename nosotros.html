<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosotros | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Conoce a Geriátrico Señor de Nazareno: una entidad autorizada por la Dirección de Salud Lima Centro, conformada por profesionales de la salud acreditados, dedicada al bienestar del adulto mayor en San Borja, Lima.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="nosotros">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <!-- ================= OPENER — who we are, type + photo together ================= -->
  <section class="page-opener">
    <div class="container">
      <div class="page-opener-grid">
        <div class="page-opener-intro" data-reveal>
          <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.nosotros"></span></div>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="about.eyebrow"></span></div>
          <h1 data-i18n="about.title"></h1>
          <p class="lede" data-i18n="about.lede"></p>
        </div>
        <div class="page-opener-media" data-reveal>
          <figure class="page-opener-figure-main">
            <img src="assets/images/gallery/4.jpg" alt="Personal médico de Nazareno junto a la imagen del Señor de Nazareno en la residencia" loading="eager">
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= NUESTRO ENFOQUE — approach, text + photo ================= -->
  <section class="section section-alt">
    <div class="container">
      <div class="split-editorial" data-reveal>
        <div class="split-editorial-intro">
          <h2 data-i18n-html="about.approachTitleHtml"></h2>
          <p class="lede" data-i18n="about.body1"></p>
          <p class="lede" style="margin-top:1rem" data-i18n="about.body2"></p>
        </div>
        <figure class="split-editorial-media">
          <img src="assets/images/gallery/7.jpg" alt="Áreas comunes al aire libre de la residencia" loading="lazy">
        </figure>
      </div>
    </div>
  </section>

  <!-- ================= NUESTRO EQUIPO — dark immersive, people-led ================= -->
  <section class="section section-dark-editorial">
    <div class="container">
      <div class="split-editorial" data-reveal>
        <figure class="split-editorial-media">
          <img src="assets/images/gallery/3.jpg" alt="Nuestro equipo de enfermería y médico" loading="lazy">
        </figure>
        <div class="split-editorial-intro">
          <h2 data-i18n-html="about.teamTitleHtml"></h2>
          <p class="lede" style="color:rgba(255,255,255,.75)" data-i18n="about.teamBody"></p>
          <a class="btn btn-outline" style="margin-top:1.4rem;border-color:rgba(255,255,255,.4);color:#fff" href="staff.html" data-i18n="cta.verStaff"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= LA RESIDENCIA — real certifications, science/rigor framing ================= -->
  <section class="section section-dark-editorial science-section">
    <div class="science-bg" aria-hidden="true">
      <video autoplay muted loop playsinline preload="metadata" poster="assets/videos/dna-science-poster.jpg">
        <source src="assets/videos/dna-science.mp4" type="video/mp4">
      </video>
    </div>
    <div class="container">
      <div class="split-editorial" data-reveal>
        <div class="split-editorial-intro">
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="about.residenceEyebrow"></span></div>
          <h2 style="margin-top:.6rem" data-i18n="about.residenceTitle"></h2>
          <p class="lede" style="color:rgba(255,255,255,.75)" data-i18n="about.residenceBody"></p>
        </div>
        <div class="cert-strip cert-strip-dark" id="certStripAbout" style="justify-content:flex-start"></div>
      </div>
    </div>
  </section>

  <!-- ================= NUESTRAS RESIDENCIAS — dark, reuses the sitewide residence component ================= -->
  <section class="section section-dark-editorial">
    <div class="container">
      <div class="residencias-dark-grid">
        <div class="residencias-dark-intro" data-reveal>
          <h2 data-i18n-html="home.sedesTitleHtml"></h2>
          <p class="lede" style="color:rgba(255,255,255,.75)" data-i18n="home.sedesLede"></p>
          <a class="btn btn-accent" href="residencias.html" data-i18n="cta.conocerResidencias"></a>
        </div>
        <div class="residence-grid" id="residenceGridAbout"></div>
      </div>
    </div>
  </section>

  <!-- ================= VISIT US ================= -->
  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band cta-band-photo">
        <img src="assets/images/gallery/navidad2.jpg" alt="" aria-hidden="true">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  registerRender(() => renderResidenceBig("residenceGridAbout"));
  registerRender(() => renderCertifications("certStripAbout"));
</script>
</body>
</html>
