<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosotros | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Conoce a Geriátrico Señor de Nazareno: una entidad autorizada por la Dirección de Salud Lima Centro, conformada por profesionales de la salud acreditados, dedicada al bienestar del adulto mayor en San Borja, Lima.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="nosotros">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.nosotros"></span></div>
      <div class="eyebrow"><span class="eyebrow-label" data-i18n="about.eyebrow"></span></div>
      <h1 data-i18n="about.title" style="margin-top:.7rem;max-width:16ch"></h1>
      <p class="lede" style="margin-top:1.2rem" data-i18n="about.lede"></p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="photo-editorial" data-reveal>
        <div class="big"><img src="assets/images/gallery/4.jpg" alt="Personal médico de Nazareno junto a la imagen del Señor de Nazareno en la residencia" loading="lazy"></div>
        <div class="stack">
          <div class="card-media"><img src="assets/images/sedes/sede-san-borja.jpg" alt="Fachada de la sede San Borja" loading="lazy"></div>
          <div class="card-media"><img src="assets/images/gallery/7.jpg" alt="Áreas comunes al aire libre de la residencia" loading="lazy"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-2" style="gap:3rem">
        <div data-reveal>
          <p class="lede mt-0" data-i18n="about.body1"></p>
          <p class="lede" style="margin-top:1.2rem" data-i18n="about.body2"></p>
        </div>
        <div data-reveal style="--i:1">
          <h3 data-i18n="about.residenceTitle"></h3>
          <p class="lede" style="margin-top:.8rem" data-i18n="about.residenceBody"></p>
          <h3 style="margin-top:2rem" data-i18n="about.teamTitle"></h3>
          <p class="lede" style="margin-top:.8rem" data-i18n="about.teamBody"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight section-alt">
    <div class="container" data-reveal>
      <div class="trust-strip">
        <div class="trust-item">
          <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.6c0 4.4-8.8 10.2-8.8 10.2S3.2 13 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg></span>
          <div><strong data-i18n="home.trust1t"></strong><p data-i18n="home.trust1p"></p></div>
        </div>
        <div class="trust-item">
          <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1L6.6 18.3l1.3-6-4.6-4.1 6.1-.6L12 2Z"/></svg></span>
          <div><strong data-i18n="home.trust2t"></strong><p data-i18n="home.trust2p"></p></div>
        </div>
        <div class="trust-item">
          <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.8-3 8.9-7 10-4-1.1-7-5.2-7-10V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg></span>
          <div><strong data-i18n="home.trust3t"></strong><p data-i18n="home.trust3p"></p></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head center" data-reveal>
        <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.sedesEyebrow"></span></div>
        <h2 data-i18n="home.sedesTitle" style="margin-top:.6rem"></h2>
      </div>
      <div class="grid" style="gap:1.6rem" id="sedesGrid"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  registerRender(() => renderSedes("sedesGrid"));
</script>
</body>
</html>
