<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geriátrico Señor de Nazareno — Residencia Geriátrica en San Borja, Lima</title>
<meta name="description" content="Casa de Reposo y Residencia Geriátrica Señor de Nazareno: atención integral y especializada para personas mayores, en un entorno seguro, cómodo y lleno de calidez humana. Dos sedes en San Borja, Lima.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="preload" as="video" href="assets/videos/hero-residencia.mp4" type="video/mp4">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="inicio">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">

  <!-- ================= CINEMATIC FULL-BLEED VIDEO HERO =================
       The video IS the hero canvas — nav, headline, copy and CTAs are
       composed directly on top of it, not beside it in a column. -->
  <section class="hero-cinematic" id="heroSection">
    <div class="hero-media">
      <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="assets/videos/hero-poster.jpg" aria-label="Video cinemático de la sede San Borja">
        <source src="assets/videos/hero-residencia.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero-exit-scrim" id="heroExitScrim" aria-hidden="true"></div>
    <div class="hero-overlay container">
      <div class="eyebrow" id="heroEyebrow" data-i18n="home.eyebrow"></div>
      <h1 id="heroHeadline" data-i18n="home.heroTitle"></h1>
      <p class="lede" id="heroLede" data-i18n="home.heroLede"></p>
      <div class="hero-actions" id="heroActions">
        <a class="btn btn-accent" id="heroCtaAgendar" target="_blank" rel="noopener">
          <span data-i18n="cta.agendarVisita"></span>
          <span class="btn-arrow"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
        <a class="btn btn-outline" href="residencias.html" data-i18n="cta.conocerResidencias"></a>
      </div>
      <div class="hero-badges" id="heroBadges">
        <div class="hero-badge"><b data-i18n="home.badge1n"></b><span data-i18n="home.badge1t"></span></div>
        <div class="hero-badge"><b data-i18n="home.badge2n"></b><span data-i18n="home.badge2t"></span></div>
        <div class="hero-badge"><b data-i18n="home.badge3n"></b><span data-i18n="home.badge3t"></span></div>
      </div>
    </div>
  </section>

  <!-- ================= TRUST — typographic hierarchy, not feature cards ================= -->
  <section class="section-compact">
    <div class="container" data-reveal>
      <div class="trust-typo">
        <div class="trust-typo-item">
          <span class="trust-typo-num">01</span>
          <h3><span class="ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.6c0 4.4-8.8 10.2-8.8 10.2S3.2 13 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg></span><span data-i18n="home.trust1t"></span></h3>
          <p data-i18n="home.trust1p"></p>
        </div>
        <div class="trust-typo-item">
          <span class="trust-typo-num">02</span>
          <h3><span class="ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1L6.6 18.3l1.3-6-4.6-4.1 6.1-.6L12 2Z"/></svg></span><span data-i18n="home.trust2t"></span></h3>
          <p data-i18n="home.trust2p"></p>
        </div>
        <div class="trust-typo-item">
          <span class="trust-typo-num">03</span>
          <h3><span class="ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.8-3 8.9-7 10-4-1.1-7-5.2-7-10V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg></span><span data-i18n="home.trust3t"></span></h3>
          <p data-i18n="home.trust3p"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= WHO WE ARE ================= -->
  <section class="section-tight">
    <div class="container">
      <div class="photo-editorial">
        <div class="big" data-reveal>
          <img src="assets/images/gallery/5.jpg" alt="Residentes y personal de cuidado compartiendo una actividad recreativa" loading="lazy">
        </div>
        <div class="stack">
          <div data-reveal style="--i:1">
            <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.aboutEyebrow"></span></div>
            <h2 data-i18n="home.aboutTitle" style="margin-top:.6rem"></h2>
            <p class="lede" style="margin-top:1rem" data-i18n="home.aboutBody"></p>
            <a class="btn btn-outline" style="margin-top:1.4rem" href="nosotros.html" data-i18n="home.aboutCta"></a>
          </div>
          <div class="card-media" data-reveal style="--i:2">
            <img src="assets/images/sedes/sede-san-borja.jpg" alt="Fachada de la sede San Borja" loading="lazy">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= RESIDENCES — dark immersive moment ================= -->
  <section class="section section-editorial section-dark-editorial">
    <div class="container">
      <div class="residencias-dark-grid">
        <div class="residencias-dark-intro" data-reveal>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.sedesEyebrow"></span></div>
          <h2 data-i18n-html="home.sedesTitleHtml"></h2>
          <p class="lede" style="color:rgba(255,255,255,.75)" data-i18n="home.sedesLede"></p>
          <a class="btn btn-accent" id="sedesCtaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.conocerResidencias"></a>
          <blockquote class="residencias-quote" id="residenciasQuote"></blockquote>
        </div>
        <div class="residence-grid" id="residenceBigGrid"></div>
      </div>
    </div>
  </section>

  <!-- ================= SERVICES — editorial tab strip + floating detail card ================= -->
  <section class="section section-editorial">
    <div class="container">
      <div class="services-editorial" id="servicesEditorial" data-reveal></div>
    </div>
  </section>

  <!-- ================= MEDICAL CARE (STAFF) ================= -->
  <section class="section">
    <div class="container">
      <div class="section-head" data-reveal>
        <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.staffEyebrow"></span></div>
        <h2 data-i18n="home.staffTitle" style="margin-top:.6rem"></h2>
        <p class="lede" style="margin-top:1rem" data-i18n="home.staffLede"></p>
      </div>
      <div class="grid" style="gap:1.6rem" id="staffGrid"></div>
      <div class="text-center" style="margin-top:2.5rem">
        <a class="btn btn-outline" href="staff.html" data-i18n="cta.verStaff"></a>
      </div>
    </div>
  </section>

  <!-- ================= LIFE AT NAZARENO — editorial filmstrip ================= -->
  <section class="section section-editorial section-alt">
    <div class="container">
      <div class="life-editorial" id="lifeEditorial" data-reveal></div>
    </div>
  </section>

  <!-- ================= GALLERY TEASER ================= -->
  <section class="section section-alt">
    <div class="container">
      <div class="section-head" data-reveal>
        <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.galleryEyebrow"></span></div>
        <h2 data-i18n="home.galleryTitle" style="margin-top:.6rem"></h2>
      </div>
      <div class="gallery-grid" id="galleryPreview"></div>
      <div class="text-center" style="margin-top:2rem">
        <a class="btn btn-outline" href="galeria.html" data-i18n="cta.verGaleria"></a>
      </div>
    </div>
  </section>

  <!-- ================= TESTIMONIALS — dark immersive, real hierarchy ================= -->
  <section class="section section-editorial section-dark-editorial">
    <div class="container">
      <div class="testimonials-dark-grid">
        <div class="testimonials-dark-intro" data-reveal>
          <h2 data-i18n-html="home.testiTitleHtml"></h2>
          <p class="lede" data-i18n="home.testiLede"></p>
        </div>
        <div id="testimonialsGrid" data-reveal></div>
      </div>
    </div>
  </section>

  <!-- ================= CERTIFICATIONS (with sonar signal texture) ================= -->
  <section class="section-tight section-alt sonar-host" data-sonar>
    <div class="container">
      <div class="section-head center" data-reveal style="margin-bottom:2rem">
        <h3 data-i18n="home.certTitle"></h3>
      </div>
      <div class="cert-strip" id="certStrip" data-reveal></div>
    </div>
  </section>

  <!-- ================= BLOG TEASER — editorial split ================= -->
  <section class="section section-editorial">
    <div class="container">
      <div class="blog-editorial">
        <div class="blog-editorial-intro" data-reveal>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="home.blogEyebrow"></span></div>
          <h2 data-i18n="home.blogTitle" style="margin-top:.7rem"></h2>
          <p class="lede" data-i18n="home.blogLede"></p>
          <a class="link-arrow" href="blog.html"><span data-i18n="cta.verTodo"></span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
        <div class="grid grid-3" id="blogGrid" data-reveal-stagger></div>
      </div>
    </div>
  </section>

  <!-- ================= CTA BAND ================= -->
  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p class="text-muted" style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaBandWhatsapp" target="_blank" rel="noopener" data-i18n="cta.hablarWhatsapp"></a>
          <a class="btn btn-ghost-light" href="contacto.html" data-i18n="nav.contacto"></a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/sonar-grid.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("heroCtaAgendar").href = SITE_DATA.brand.whatsapp.agendar;
  document.getElementById("ctaBandWhatsapp").href = SITE_DATA.brand.whatsapp.info;
  document.getElementById("sedesCtaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;

  function renderResidenciasQuote(){
    const el = document.getElementById("residenciasQuote");
    const lang = getLang();
    const t = SITE_DATA.testimonials.find(x => x.name === "Humberto Valdivia Yoplac") || SITE_DATA.testimonials[0];
    el.innerHTML = `<p>&ldquo;${t[lang] || t.es}&rdquo;</p><span>— ${t.name}</span>`;
  }

  registerRender(() => renderServicesEditorial("servicesEditorial"));
  registerRender(() => renderResidenceBig("residenceBigGrid"));
  registerRender(renderResidenciasQuote);
  registerRender(() => renderStaff("staffGrid"));
  registerRender(() => renderLifeEditorial("lifeEditorial"));
  registerRender(() => renderTestimonials("testimonialsGrid"));
  registerRender(() => renderCertifications("certStrip"));
  registerRender(() => renderGallery("galleryPreview", { limit: 8 }));
  registerRender(() => renderBlog("blogGrid", { slugs: ["entorno-seguro-adaptado","prevencion-de-caidas","beneficios-cuidados-geriatricos"] }));
  // initSonarGrids() now runs from main.js's shared boot sequence for every page.
</script>
</body>
</html>
