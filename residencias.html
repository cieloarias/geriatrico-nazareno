<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residencias | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Conoce nuestras dos residencias en San Borja, Lima: Sede San Borja (Av. Las Artes Norte 1249) y Sede Salvador Dalí (Salvador Dalí 490). Mismo equipo, mismos estándares de cuidado.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="residencias">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.residencias"></span></div>
      <div class="eyebrow"><span class="eyebrow-label" data-i18n="sedes.eyebrow"></span></div>
      <h1 data-i18n="sedes.title" style="margin-top:.7rem;max-width:18ch"></h1>
      <p class="lede" style="margin-top:1.2rem" data-i18n="sedes.lede"></p>
    </div>
  </section>

  <section class="section-tight section-dark-editorial">
    <div class="container">
      <div class="residence-grid" id="residenceBigGrid"></div>
      <blockquote class="residencias-quote" id="residenciasQuote" style="margin:2.5rem auto 0;text-align:center;max-width:46ch;border-top:none;padding-top:0"></blockquote>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="services-editorial" id="servicesEditorial" data-reveal></div>
      <div class="text-center" style="margin-top:2.5rem">
        <a class="btn btn-primary" href="servicios.html" data-i18n="cta.verServicios"></a>
      </div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
          <a class="btn btn-ghost-light" href="contacto.html" data-i18n="nav.contacto"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  registerRender(() => renderResidenceBig("residenceBigGrid"));
  registerRender(function(){
    const el = document.getElementById("residenciasQuote");
    const lang = getLang();
    const t = SITE_DATA.testimonials.find(x => x.name === "Humberto Valdivia Yoplac") || SITE_DATA.testimonials[0];
    el.innerHTML = `<p>&ldquo;${t[lang] || t.es}&rdquo;</p><span>— ${t.name}</span>`;
  });
  registerRender(() => renderServicesEditorial("servicesEditorial"));
</script>
</body>
</html>
