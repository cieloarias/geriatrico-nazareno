<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Médico | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Conoce a los médicos de la Residencia Geriátrica Señor de Nazareno: Dra. Ernestina Palomino Sulca y Dr. Daniel Arias Cerquin, profesionales acreditados por el Colegio Médico del Perú especializados en geriatría.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="staff">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <!-- ================= OPENER — type + photo together ================= -->
  <section class="page-opener">
    <div class="container">
      <div class="page-opener-grid">
        <div class="page-opener-intro" data-reveal>
          <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.staff"></span></div>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="staff.eyebrow"></span></div>
          <h1 data-i18n="staff.title"></h1>
          <p class="lede" data-i18n="staff.lede"></p>
          <div class="page-opener-stat">
            <strong id="staffCount"></strong>
            <span data-i18n="staff.stat"></span>
          </div>
        </div>
        <div class="page-opener-media" data-reveal>
          <figure class="page-opener-figure-main" style="aspect-ratio:4/3.4">
            <img id="staffPhotoMain" src="" alt="" loading="eager" style="object-position: top center">
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= FULL PROFILES — real credentials, alternating composition ================= -->
  <section class="section">
    <div class="container">
      <div id="staffProfiles"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band cta-band-photo">
        <img src="assets/images/gallery/6.jpg" alt="" aria-hidden="true">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  document.getElementById("staffCount").textContent = SITE_DATA.staff.length;
  var mainDoc = SITE_DATA.staff[0];
  var mainImg = document.getElementById("staffPhotoMain");
  mainImg.src = mainDoc.photo; mainImg.alt = mainDoc.name;
  registerRender(() => renderStaffEditorial("staffProfiles"));
</script>
</body>
</html>
