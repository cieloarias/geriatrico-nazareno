<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Contáctanos por WhatsApp, teléfono o formulario. Coordina una visita a nuestras residencias en San Borja, Lima: (+51) 978 653 991.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contacto">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <!-- ================= OPENER — type + photo together ================= -->
  <section class="page-opener">
    <div class="container">
      <div class="page-opener-grid">
        <div class="page-opener-intro" data-reveal>
          <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.contacto"></span></div>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="contact.eyebrow"></span></div>
          <h1 data-i18n="contact.title"></h1>
          <p class="lede" data-i18n="contact.lede"></p>
        </div>
        <div class="page-opener-media" data-reveal>
          <figure class="page-opener-figure-main">
            <img src="assets/images/gallery/8.jpg" alt="Recepción de la residencia" loading="eager">
          </figure>
          <figure class="page-opener-figure-peek">
            <img src="assets/images/gallery/10.jpg" alt="Sala de estar común" loading="eager">
          </figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= IMMEDIATE CONTACT OPTIONS — lines + arrows, not boxes ================= -->
  <section class="section-tight">
    <div class="container">
      <div class="contact-options" data-reveal>
        <a class="contact-option" id="tileWhatsapp" target="_blank" rel="noopener">
          <span class="contact-option-num">01</span>
          <span class="contact-option-body"><strong data-i18n="contact.whatsappTitle"></strong><span data-i18n="contact.whatsappBody"></span></span>
          <span class="contact-option-arrow"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
        <a class="contact-option" id="tilePhone">
          <span class="contact-option-num">02</span>
          <span class="contact-option-body"><strong data-i18n="contact.phoneTitle"></strong><span data-i18n="contact.phoneBody"></span></span>
          <span class="contact-option-arrow"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
        <a class="contact-option" href="#contactSedes">
          <span class="contact-option-num">03</span>
          <span class="contact-option-body"><strong data-i18n="contact.locationTitle"></strong><span data-i18n="contact.locationBody"></span></span>
          <span class="contact-option-arrow"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </div>
    </div>
  </section>

  <!-- ================= FORM + LOCATION — one integrated composition ================= -->
  <section class="section">
    <div class="container">
      <div class="grid grid-2" style="gap:3rem;align-items:flex-start">
        <div data-reveal>
          <h2 data-i18n="contact.formTitle"></h2>
          <p class="text-muted" style="margin-top:.6rem" data-i18n="contact.formLede"></p>

          <form id="contactForm" class="form-grid" style="margin-top:2rem" novalidate>
            <div class="field">
              <label for="nombres" data-i18n="contact.fieldNombres"></label>
              <input type="text" id="nombres" name="nombres" required maxlength="50" data-i18n-attr="placeholder:contact.placeholderNombres">
            </div>
            <div class="field">
              <label for="apellidos" data-i18n="contact.fieldApellidos"></label>
              <input type="text" id="apellidos" name="apellidos" required maxlength="50" data-i18n-attr="placeholder:contact.placeholderApellidos">
            </div>
            <div class="field">
              <label for="telefono" data-i18n="contact.fieldTelefono"></label>
              <input type="tel" id="telefono" name="telefono" required maxlength="9" data-i18n-attr="placeholder:contact.placeholderTelefono">
            </div>
            <div class="field">
              <label for="correo" data-i18n="contact.fieldCorreo"></label>
              <input type="email" id="correo" name="correo" required maxlength="120" data-i18n-attr="placeholder:contact.placeholderCorreo">
            </div>
            <div class="field full">
              <label for="comentario" data-i18n="contact.fieldComentario"></label>
              <textarea id="comentario" name="comentario" rows="5" data-i18n-attr="placeholder:contact.placeholderComentario"></textarea>
            </div>
            <div class="field full">
              <button type="submit" class="btn btn-primary" data-i18n="contact.submit"></button>
              <p class="form-note" data-i18n="contact.formNote"></p>
            </div>
          </form>

          <div id="contactSuccess" hidden class="card" style="padding:2rem;margin-top:1rem">
            <h3 data-i18n="contact.successTitle"></h3>
            <p class="text-muted" style="margin-top:.6rem" data-i18n="contact.successBody"></p>
          </div>
        </div>

        <div data-reveal style="--i:1" id="contactSedes"></div>
      </div>
    </div>
  </section>

  <!-- ================= VISIT US ================= -->
  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band cta-band-photo">
        <img src="assets/images/gallery/navidad3.jpg" alt="" aria-hidden="true">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsappBand" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("tileWhatsapp").href = SITE_DATA.brand.whatsapp.info;
  document.getElementById("tilePhone").href = SITE_DATA.brand.telHref;
  document.getElementById("ctaWhatsappBand").href = SITE_DATA.brand.whatsapp.agendar;

  function renderContactSedes(){
    const el = document.getElementById("contactSedes");
    const lang = getLang();
    el.innerHTML = SITE_DATA.sedes.map(function(s){
      const d = s[lang] || s.es;
      return `<article class="contact-location-card">
        <div class="map-thumb"><img src="${s.mapImage}" alt="${(I18N[lang] && I18N[lang]["contact.locationTitle"]) || "Ubicación"} — ${d.name}" loading="lazy"></div>
        <div>
          <strong>${d.name}</strong>
          <p>${s.address}</p>
          <p>${s.phones.join(" · ")}</p>
        </div>
      </article>`;
    }).join("");
  }
  registerRender(renderContactSedes);
</script>
</body>
</html>
