<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería | Geriátrico Señor de Nazareno</title>
<meta name="description" content="Galería de imágenes de la Residencia Geriátrica Señor de Nazareno: instalaciones, actividades y momentos compartidos con nuestros residentes en San Borja, Lima.">
<link rel="icon" href="assets/images/brand/favicon.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="galeria">
<a class="skip-link" href="#main" data-i18n="common.skip">Saltar al contenido principal</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <section class="page-opener" id="galleryOpener">
    <div class="container">
      <div class="page-opener-grid">
        <div class="page-opener-intro" data-reveal>
          <div class="breadcrumb"><a href="index.html" data-i18n="nav.inicio"></a> / <span data-i18n="nav.galeria"></span></div>
          <div class="eyebrow"><span class="eyebrow-label" data-i18n="gallery.eyebrow"></span></div>
          <h1 data-i18n-html="gallery.titleHtml"></h1>
          <p class="lede" data-i18n="gallery.lede"></p>
          <div class="page-opener-stat">
            <strong id="galleryCount"></strong>
            <span data-i18n="gallery.stat"></span>
          </div>
        </div>
        <div class="page-opener-media" data-reveal>
          <figure class="page-opener-figure-main">
            <img src="assets/images/gallery/navidad2.jpg" alt="Una residente y su familia compartiendo un momento cálido en la residencia" loading="eager">
          </figure>
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight" id="galleryCollectionSection">
    <div class="container">
      <div class="life-mosaic mosaic-lg" id="galleryFull"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" data-reveal>
      <div class="cta-band cta-band-photo">
        <img src="assets/images/gallery/8.jpg" alt="" aria-hidden="true">
        <div>
          <h2 data-i18n="home.ctaBandTitle"></h2>
          <p style="color:rgba(255,255,255,.78);margin-top:.6rem" data-i18n="home.ctaBandLede"></p>
        </div>
        <div class="actions">
          <a class="btn btn-accent" id="ctaWhatsapp" target="_blank" rel="noopener" data-i18n="cta.agendarVisita"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("ctaWhatsapp").href = SITE_DATA.brand.whatsapp.agendar;
  document.getElementById("galleryCount").textContent = SITE_DATA.gallery.length;
  registerRender(() => renderGalleryMosaic("galleryFull"));
</script>
</body>
</html>
